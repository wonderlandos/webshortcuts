# Web Shortcuts: a magnifier in the menu bar; type what to look for once, then pick the site, and
# the site's own search opens in the browser through wol.open (permission "open"). No web request
# is made by the plugin itself. ([[search]] entries are planned in WolOS 0.13, so this is a popover.)
schema = 1
id = "wonderlandos.webshortcuts"
name = "Web Shortcuts"
version = "1.0"
author = "WolOS"
license = "GPL-2.0-or-later"
description = "Search Wikipedia, the Arch Wiki, GitHub and nine more sites from the menu bar, in two clicks."
min_wolos = "0.13"
permissions = ["open"]
icon = "icon.png"
screenshots = ["preview.webp"]
categories = ["Work", "Develop"]
homepage = "https://github.com/wonderlandos/webshortcuts"
about = "Web Shortcuts searches a website without opening the browser first. Click the magnifier in the menu bar, type what you are looking for, and press Search next to the site: Wikipedia, Wiktionary, the Arch Wiki, Arch packages, GitHub, MDN Web Docs, Rust crates, Stack Overflow, YouTube, OpenStreetMap, DuckDuckGo or the manual pages. The site's own search opens in your browser.\n\nWith nothing typed, the button opens the site itself. The words stay in the box until you change them, so you can try the same search on several sites.\n\nThe plugin only builds the address; your browser opens it. Nothing is read from the web, and what you type is not saved."

[[menubar]]
id = "bar"
script = "bar.lua"
side = "right"
